<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Scout Lane AI creates route recommendations that match your mood.">
  <title>Scout Lane AI | Routes that feel like you</title>
  <style>
    :root{--ink:#f5f5f5;--dim:#555;--yellow:#f5e020;--line:rgba(255,255,255,.08)}*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background:#0a0a0a;color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}.app-shell{min-height:100vh;background:#0a0a0a}.hero{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px;text-align:center}.hero-grid{position:absolute;inset:0;opacity:.7;background-image:linear-gradient(rgba(245,224,32,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(245,224,32,.035) 1px,transparent 1px);background-size:64px 64px}.hero-glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#f5e02018,transparent 68%);top:4%;left:3%;animation:float 8s ease-in-out infinite}.hero-glow.alt{width:340px;height:340px;top:auto;left:auto;right:2%;bottom:0;background:radial-gradient(circle,#10b98114,transparent 68%);animation-delay:-3s}.hero-content{position:relative;z-index:1;max-width:720px;animation:rise .8s ease both}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--yellow);border:1px solid #f5e02033;background:#f5e0200d;border-radius:999px;padding:7px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--yellow);box-shadow:0 0 14px var(--yellow)}.brand-lockup{display:flex;align-items:center;justify-content:center;gap:14px;margin:28px 0 20px}.brand-name{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-1.5px}.brand-name span,.accent{color:var(--yellow)}.hero h1{font-size:clamp(42px,8vw,82px);line-height:1;letter-spacing:-3px;font-weight:800}.hero h1 span{color:var(--yellow)}.hero-copy{max-width:480px;margin:20px auto 32px;color:#777;font-size:16px;line-height:1.7}.primary-action{border:0;border-radius:10px;background:var(--yellow);color:#0a0a0a;padding:14px 24px;font-weight:800;box-shadow:0 12px 36px #f5e02024;transition:transform .2s}.primary-action:hover{transform:translateY(-2px)}.hero-stats{display:flex;justify-content:center;gap:42px;flex-wrap:wrap;margin-top:54px}.hero-stats strong{display:block;font-size:18px}.hero-stats span{display:block;color:#444;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}.logo{width:52px;height:52px}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#0a0a0af2;position:relative;z-index:3}.topbar-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800}.topbar-brand .logo{width:30px;height:30px}.back-button{color:#888;border:1px solid var(--line);background:transparent;border-radius:7px;padding:7px 12px;font-size:11px}.back-button:hover{color:var(--ink);border-color:#fff3}.workspace{height:calc(100vh - 64px);display:grid;grid-template-columns:350px 1fr}.panel{background:#0d0d0d;border-right:1px solid var(--line);overflow:auto;padding:20px 16px}.panel-header{margin-bottom:22px}.kicker,.section-label{color:#444;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.panel h2{font-size:22px;margin-top:6px;letter-spacing:-.5px}.field{margin-bottom:13px}.field label{display:block;color:#444;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.input-wrap{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#ffffff05;border-radius:8px;padding:10px 11px}.input-wrap:focus-within{border-color:#f5e02066}.input-wrap input{width:100%;color:var(--ink);border:0;outline:0;background:transparent;font-size:13px}.input-wrap input::placeholder{color:#555}.swap-button{display:block;margin:-7px 0 6px auto;border:0;background:transparent;color:#555;font-size:11px}.swap-button:hover{color:var(--yellow)}.section-label{margin:22px 0 9px}.mood-grid,.preference-grid{display:flex;flex-wrap:wrap;gap:6px}.choice{color:#666;background:#ffffff03;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:11px;transition:.2s}.choice:hover{color:var(--ink);border-color:#fff3}.choice[aria-pressed=true]{color:var(--choice-color,var(--yellow));border-color:var(--choice-color,var(--yellow));background:#ffffff0d}.mood-note{color:#555;font-size:11px;font-style:italic;margin-top:9px}.find-button{width:100%;margin-top:22px;border:0;border-radius:8px;padding:12px;color:#0a0a0a;background:var(--mood-color,var(--yellow));font-size:12px;font-weight:800;transition:filter .2s,transform .2s}.find-button:hover{filter:brightness(1.1);transform:translateY(-1px)}.results{margin-top:25px}.results-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.results-heading span{color:#444;font-size:10px;text-transform:uppercase;letter-spacing:.1em}.route-card{position:relative;border:1px solid var(--line);border-radius:9px;background:#ffffff03;padding:14px;margin-bottom:8px;transition:.2s}.route-card:hover,.route-card.selected{border-color:var(--route-color);background:#ffffff0d;transform:translateY(-1px)}.route-card.selected:before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;background:var(--route-color)}.route-card button{width:100%;text-align:left;border:0;background:transparent;color:inherit}.route-title{color:var(--route-color);font-size:12px;font-weight:700;margin-bottom:5px}.route-meta{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}.route-time{font-size:18px;font-weight:800}.route-distance{color:#555;font-size:11px}.score{margin-top:7px}.score-line{display:flex;justify-content:space-between;color:#555;font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}.score-line strong{color:var(--score-color)}.score-track{height:2px;background:#ffffff0d}.score-fill{height:100%;width:var(--score);background:var(--score-color)}.insight{margin-top:12px;padding:9px 10px;border-left:2px solid var(--route-color);background:#f5e02008;color:#888;font-size:11px;line-height:1.6}.insight strong{display:block;color:var(--route-color);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}.empty-state{color:#444;text-align:center;padding:38px 15px;font-size:11px;line-height:1.7}.empty-state .logo{opacity:.25}.map-stage{position:relative;height:100%;overflow:hidden;background:#151b1a}.map-stage:before{content:"";position:absolute;inset:0;opacity:.5;background-image:linear-gradient(25deg,transparent 48%,#53655d 49%,#53655d 50%,transparent 51%),linear-gradient(110deg,transparent 47%,#34453f 48%,#34453f 50%,transparent 51%);background-size:230px 180px,180px 240px}.map-grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:80px 80px;transform:rotate(-7deg) scale(1.2)}.map-title{position:absolute;top:20px;left:24px;z-index:1;color:#ffffff66;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.route-svg{position:absolute;inset:8% 5% 10%;width:90%;height:82%;overflow:visible}.route-line-shadow{fill:none;stroke:var(--route-color,var(--yellow));stroke-width:22;opacity:.12;stroke-linecap:round;stroke-linejoin:round}.route-line{fill:none;stroke:var(--route-color,var(--yellow));stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.2s ease forwards}.map-marker{fill:var(--route-color,var(--yellow));stroke:#101615;stroke-width:4}.map-marker.end{fill:#f5f5f5}.map-empty{position:absolute;inset:0;display:grid;place-items:center;z-index:1;background:#10171599;backdrop-filter:blur(2px)}.map-empty div{color:#ffffff66;text-align:center;font-size:12px}.map-empty strong{display:block;color:#ffffffaa;font-size:30px;margin-bottom:8px}.route-summary{position:absolute;top:20px;right:20px;z-index:2;padding:13px 15px;min-width:190px;border:1px solid #ffffff33;border-radius:9px;background:#0a0a0ae8;backdrop-filter:blur(12px)}.summary-name{color:var(--route-color);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}.summary-values{display:flex;gap:20px;margin-top:8px}.summary-values strong{display:block;font-size:18px}.summary-values span{color:#555;display:block;font-size:9px;margin-top:2px}.route-switcher{position:absolute;z-index:2;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:90%;overflow:auto;padding:2px}.route-switcher button{flex:0 0 auto;color:#777;border:1px solid #ffffff1a;border-radius:7px;background:#0a0a0ae8;padding:8px 11px;font-size:11px;white-space:nowrap}.route-switcher button[aria-pressed=true]{color:#0a0a0a;background:var(--route-color);border-color:var(--route-color)}.mobile-tabs{display:none}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translate(30px,18px) scale(1.05)}}@keyframes draw{to{stroke-dashoffset:0}}
    @media(max-width:760px){body{overflow:hidden}.topbar{height:58px;padding:0 14px}.workspace{height:calc(100vh - 58px);display:block}.panel{height:100%;border-right:0;padding:17px 14px}.map-stage{height:100%}.mobile-tabs{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:7px;background:#ffffff08}.mobile-tabs button{color:#666;border:0;border-radius:5px;background:transparent;padding:5px 8px;font-size:10px}.mobile-tabs button[aria-pressed=true]{color:var(--ink);background:#ffffff12}.brand-name{font-size:13px;letter-spacing:0}.topbar-brand .logo{width:26px;height:26px}.back-button{padding:6px 8px}.route-summary{top:14px;right:14px}.map-title{top:16px;left:14px}}
    .map-panel{height:100%;min-height:0;min-width:0;overflow:hidden}
    @media(max-width:760px){
      html,body{height:100%;min-height:0}
      .app-shell{height:100%;min-height:0}
      .workspace{height:calc(100vh - 58px);height:calc(100dvh - 58px);min-height:0;overflow:hidden}
      .map-panel{height:100%;min-height:0;display:block;overflow:hidden}
      .map-stage{height:100%;min-height:0}
    }
  </style>
</head>
<body>
  <main id="app" class="app-shell"></main>
  <script>
    const moods=[{id:'fastest',label:'Fastest',icon:'⚡',color:'#f5e020',desc:'Pure speed, zero compromise'},{id:'scenic',label:'Scenic',icon:'◒',color:'#10b981',desc:'Beauty over efficiency'},{id:'relaxing',label:'Relaxing',icon:'⌁',color:'#06b6d4',desc:'Low stress, high calm'},{id:'local',label:'Local',icon:'⌂',color:'#f59e0b',desc:'Hidden gems and local picks'},{id:'adventure',label:'Adventure',icon:'✦',color:'#ef4444',desc:'Unexpected and memorable'}];
    const preferences=[{id:'quiet',label:'Quiet roads'},{id:'green',label:'Green views'},{id:'localStops',label:'Local stops'},{id:'detours',label:'Curious detours'}];
    const routes={fastest:[['Highway Express','18 min','24.3 km',2,9,3,1,'The direct corridor is built for a clean, early start. It is the quickest option when time is the only thing that matters.'],['Ring Road Cut','22 min','26.8 km',4,7,5,2,'A small detour reduces bottleneck risk. A steadier arrival time makes this the smart choice for a meeting.'],['Smart Predict','25 min','22.1 km',3,8,4,2,'The shortest by distance, not time. Signal timing carries you through three green waves.']],scenic:[['River Panorama','34 min','31.2 km',10,5,8,4,'This route hugs the river for 8 km. At golden hour, you will understand why locals never take the highway.'],['Park Boulevard','38 min','28.7 km',9,6,9,3,'Three parks and a Georgian terrace turn the extra minutes into a canopy-lined reset.'],['Hilltop Circuit','42 min','33.5 km',10,3,7,6,'The city panorama viewpoint is the payoff. Zero traffic, maximum spectacle.']],relaxing:[['Green Corridor','29 min','25.1 km',7,8,10,2,'Fewer merges, wider lanes and tree cover for the last 6 km. Drive calm, arrive calm.'],['Suburb Glide','31 min','27.4 km',6,9,9,1,'30 km/h zones and timed lights mean no sudden stops or lane jockeying.'],['Canal Path','36 min','29.8 km',8,9,10,3,'No traffic lights for the middle 14 km. The most genuinely peaceful option available.']],local:[['Market Quarter','33 min','26.9 km',8,5,6,7,'Pass the covered market, a 1920s cinema and three bakeries that open at 06:30.'],['Old Town Weave','37 min','24.3 km',9,4,5,8,'Cobblestone sections and a shortcut that nobody outside the district knows.'],['Artist District','40 min','28.1 km',8,6,7,6,'Street murals, independent coffee roasters and the city at its most inventive.']],adventure:[['Ridge Run','44 min','38.2 km',9,2,4,10,'A 4 km unpaved section through moorland. The kind of route that becomes a story.'],['Coastal Detour','51 min','45.7 km',10,1,6,10,'Longer by 33 minutes, rewarded with sea views from 200 metres elevation.'],['Forest Traverse','47 min','41.3 km',8,1,5,9,'Zero signal for 18 minutes. The map runs out, the road does not.']]};
    const state={page:'hero',mood:'scenic',selected:null,searched:false,tab:'search',from:'London Bridge, SE1',to:'Hampstead Heath, NW3',prefs:new Set()};const app=document.getElementById('app');const routePoints=['18,80 28,65 42,70 57,43 78,48','18,80 24,56 43,40 61,61 78,48','18,80 35,82 45,55 60,32 78,48'];
    function logo(size=52){return `<svg class="logo" style="width:${size}px;height:${size}px" viewBox="0 0 60 60" role="img" aria-label="Scout Lane mark"><circle cx="30" cy="30" r="16" fill="#000" stroke="#c8a800" stroke-width="2.3"/><text x="30" y="36" text-anchor="middle" fill="#c8a800" font-size="18" font-weight="800">SL</text><path d="M12 16l8 8M48 16l-8 8M12 44l8-8M48 44l-8-8" stroke="#c8a800" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="16" r="3" fill="#c8a800"/><circle cx="48" cy="16" r="3" fill="#c8a800"/><circle cx="12" cy="44" r="3" fill="#c8a800"/><circle cx="48" cy="44" r="3" fill="#c8a800"/></svg>`}
    function hero(){return `<section class="hero"><div class="hero-grid"></div><div class="hero-glow"></div><div class="hero-glow alt"></div><div class="hero-content"><div class="eyebrow"><span class="status-dot"></span> AI-powered route intelligence</div><div class="brand-lockup">${logo()}<div class="brand-name">Scout Lane<span>AI</span></div></div><h1>Routes that feel<br><span>like you</span></h1><p class="hero-copy">Not the fastest. Not the shortest. The route that matches your mood, your morning, your moment.</p><button class="primary-action" data-action="open">Open Scout Lane <span aria-hidden="true">→</span></button><div class="hero-stats"><div><strong>5 moods</strong><span>Route personalities</span></div><div><strong>AI insight</strong><span>Per-route analysis</span></div><div><strong>Live scores</strong><span>Real-time comparison</span></div></div></div></section>`}
    function card(route,index,mood){const [name,time,distance,scenic,traffic,relax,adventure,insight]=route;const active=state.selected===index;const scores=[['Scenic',scenic,'#f5e020'],['Traffic',traffic,'#c8f520'],['Relaxation',relax,'#f5a820'],['Adventure',adventure,'#f57820']];return `<article class="route-card ${active?'selected':''}" style="--route-color:${mood.color}"><button data-route="${index}" aria-label="Select ${name}, ${time}, ${distance}"><div class="route-title">${mood.icon} ${name}</div><div class="route-meta"><span class="route-time">${time}</span><span class="route-distance">· ${distance}</span></div>${scores.map(([label,value,color])=>`<div class="score"><div class="score-line"><span>${label}</span><strong style="--score-color:${color}">${value}/10</strong></div><div class="score-track"><div class="score-fill" style="--score:${value*10}%;--score-color:${color}"></div></div></div>`).join('')}${active?`<div class="insight"><strong>AI insight</strong>${insight}</div>`:''}</button></article>`}
    function recommendation(){const mood=moods.find(item=>item.id===state.mood);const list=routes[state.mood].map((route,index)=>({route,index}));const weight={quiet:0,green:0,localStops:0,detours:0};state.prefs.forEach(pref=>{if(pref==='quiet')weight.quiet=4;if(pref==='green')weight.green=5;if(pref==='localStops')weight.localStops=5;if(pref==='detours')weight.detours=5});list.sort((a,b)=>(b.route[3]*weight.green+b.route[5]*weight.quiet+b.route[6]*weight.detours+b.route[7].length*weight.localStops)-(a.route[3]*weight.green+a.route[5]*weight.quiet+a.route[6]*weight.detours+a.route[7].length*weight.localStops));return {mood,list}}
    function mapView(mood,selected){const has=Boolean(selected);const points=has?routePoints[selected.index%3]:'';return `<section class="map-stage" aria-label="Route visualisation"><div class="map-grid"></div><div class="map-title">Illustrative city map · static demo</div>${has?`<svg class="route-svg" viewBox="0 0 100 100" aria-label="Illustrative route from origin to destination"><polyline class="route-line-shadow" style="--route-color:${mood.color}" points="${points}"></polyline><polyline class="route-line" style="--route-color:${mood.color}" points="${points}"></polyline><circle class="map-marker" style="--route-color:${mood.color}" cx="18" cy="80" r="3.5"></circle><circle class="map-marker end" cx="78" cy="48" r="3.5"></circle></svg><div class="route-summary" style="--route-color:${mood.color}"><div class="summary-name">${mood.icon} ${selected.route[0]}</div><div class="summary-values"><div><strong>${selected.route[1]}</strong><span>travel time</span></div><div><strong>${selected.route[2]}</strong><span>distance</span></div></div></div><div class="route-switcher" role="group" aria-label="Compare routes">${routes[state.mood].map((route,index)=>`<button data-route="${index}" aria-pressed="${state.selected===index}" style="--route-color:${mood.color}">${route[1]} <span>${route[2]}</span></button>`).join('')}</div>`:`<div class="map-empty"><div><strong>◎</strong>Select a route to visualise it</div></div>`}</section>`}
    function renderApp(){const {mood,list}=recommendation();if(state.selected===null&&state.searched)state.selected=list[0].index;const selected=list.find(item=>item.index===state.selected)||null;const moodButtons=moods.map(item=>`<button class="choice" style="--choice-color:${item.color}" aria-pressed="${state.mood===item.id}" data-mood="${item.id}">${item.icon} ${item.label}</button>`).join('');const prefButtons=preferences.map(item=>`<button class="choice" aria-pressed="${state.prefs.has(item.id)}" data-pref="${item.id}">${item.label}</button>`).join('');const routeList=state.searched?list.map(item=>card(item.route,item.index,mood)).join(''):`<div class="empty-state">${logo(36)}<br>Choose a mood, tune your preferences,<br>then find a route that fits.</div>`;return `<div class="topbar"><div class="topbar-brand">${logo(30)}<span>Scout Lane<span class="accent">AI</span></span></div><div style="display:flex;align-items:center;gap:8px"><div class="mobile-tabs" role="tablist"><button data-tab="search" aria-pressed="${state.tab==='search'}">Search</button><button data-tab="map" aria-pressed="${state.tab==='map'}">Map</button></div><button class="back-button" data-action="back"><span aria-hidden="true">←</span> Back</button></div></div><div class="workspace"><aside class="panel" style="--mood-color:${mood.color}"><div class="panel-header"><div class="kicker">Your next lane</div><h2>Where are you headed?</h2></div><div class="field"><label for="from">From</label><div class="input-wrap"><span aria-hidden="true">●</span><input id="from" value="${state.from}" placeholder="Start location"></div></div><button class="swap-button" data-action="swap" aria-label="Swap origin and destination">Swap locations ↕</button><div class="field"><label for="to">To</label><div class="input-wrap"><span aria-hidden="true">◆</span><input id="to" value="${state.to}" placeholder="Destination"></div></div><div class="section-label">Travel mood</div><div class="mood-grid">${moodButtons}</div><div class="mood-note">${mood.desc}</div><div class="section-label">Fine-tune the feeling</div><div class="preference-grid">${prefButtons}</div><button class="find-button" data-action="search">Find routes <span aria-hidden="true">→</span></button><div class="results"><div class="results-heading"><span>${state.searched?'Recommended routes':'Ready when you are'}</span>${state.searched?`<span>${list.length} options</span>`:''}</div>${routeList}</div></aside><div class="map-panel">${mapView(mood,selected)}</div></div>`}
    function render(){app.innerHTML=state.page==='hero'?hero():renderApp();bind()}
    function bind(){document.querySelectorAll('[data-action="open"]').forEach(el=>el.onclick=()=>{state.page='app';render()});document.querySelectorAll('[data-action="back"]').forEach(el=>el.onclick=()=>{state.page='hero';render()});document.querySelectorAll('[data-action="swap"]').forEach(el=>el.onclick=()=>{[state.from,state.to]=[state.to,state.from];render()});document.querySelectorAll('[data-action="search"]').forEach(el=>el.onclick=()=>{state.searched=true;state.tab='map';state.selected=null;render()});document.querySelectorAll('[data-mood]').forEach(el=>el.onclick=()=>{state.mood=el.dataset.mood;state.searched=false;state.selected=null;render()});document.querySelectorAll('[data-pref]').forEach(el=>el.onclick=()=>{state.prefs.has(el.dataset.pref)?state.prefs.delete(el.dataset.pref):state.prefs.add(el.dataset.pref);render()});document.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>{state.selected=Number(el.dataset.route);state.tab='map';render()});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;applyMobileTab()});const from=document.getElementById('from'),to=document.getElementById('to');if(from)from.oninput=event=>state.from=event.target.value;if(to)to.oninput=event=>state.to=event.target.value;applyMobileTab()}
    function applyMobileTab(){if(window.innerWidth>760)return;const panel=document.querySelector('.panel'),map=document.querySelector('.map-panel');if(panel)panel.style.display=state.tab==='search'?'block':'none';if(map)map.style.display=state.tab==='map'?'block':'none'}
    window.addEventListener('resize',applyMobileTab);render();
  </script>
</body>
</html>
