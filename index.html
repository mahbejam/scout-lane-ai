<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Scout Lane AI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
html,body{height:100%;background:#0a0a0a;color:#f5f5f5;overflow:hidden}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
input{background:transparent;border:none;outline:none;color:#f5f5f5;font-size:13px;width:100%}
input::placeholder{color:#333}
button{cursor:pointer;font-family:inherit}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#222;border-radius:99px}
.fade{animation:fadeUp .4s ease forwards}
</style>
</head>
<body>
<div id="app" style="height:100vh;display:flex;flex-direction:column"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SLY="#F5E020",COL="#c8a800";

const MOODS=[
  {id:"fastest", label:"Fastest", icon:"⚡",color:"#F5E020",desc:"Pure speed, zero compromise"},
  {id:"scenic",  label:"Scenic",  icon:"🌄",color:"#10b981",desc:"Beauty over efficiency"},
  {id:"relaxing",label:"Relaxing",icon:"🍃",color:"#06b6d4",desc:"Low stress, high calm"},
  {id:"local",   label:"Local",   icon:"🏘️",color:"#f59e0b",desc:"Hidden gems & locals' picks"},
  {id:"adventure",label:"Adventure",icon:"🧭",color:"#ef4444",desc:"Unexpected & memorable"},
];

const ROUTES={
  fastest:[
    {id:"f1",name:"Highway Express",time:"18 min",dist:"24.3 km",scenic:2,traffic:9,relax:3,adv:1,color:"#F5E020",ai:"The most direct path cuts through the highway corridor. Best for early mornings when traffic is thin.",wp:[[51.505,-0.09],[51.515,-0.07],[51.525,-0.05],[51.53,-0.02]]},
    {id:"f2",name:"Ring Road Cut",time:"22 min",dist:"26.8 km",scenic:4,traffic:7,relax:5,adv:2,color:"#eab308",ai:"A slight detour reduces bottleneck risk by 40%. Ideal for meetings where punctuality matters.",wp:[[51.505,-0.09],[51.51,-0.1],[51.52,-0.08],[51.53,-0.02]]},
    {id:"f3",name:"Smart Predict",time:"25 min",dist:"22.1 km",scenic:3,traffic:8,relax:4,adv:2,color:"#ca8a04",ai:"The algorithm predicts signal timing and routes you through three green waves in sequence.",wp:[[51.505,-0.09],[51.508,-0.11],[51.518,-0.09],[51.53,-0.02]]},
  ],
  scenic:[
    {id:"s1",name:"River Panorama",time:"34 min",dist:"31.2 km",scenic:10,traffic:5,relax:8,adv:4,color:"#10b981",ai:"This route hugs the river for 8km. At golden hour you'll understand why locals never take the highway.",wp:[[51.505,-0.09],[51.5,-0.1],[51.495,-0.07],[51.5,-0.04],[51.53,-0.02]]},
    {id:"s2",name:"Park Boulevard",time:"38 min",dist:"28.7 km",scenic:9,traffic:6,relax:9,adv:3,color:"#34d399",ai:"Passes through three parks and a Georgian terrace. The canopy tunnel in spring is worth every second.",wp:[[51.505,-0.09],[51.51,-0.11],[51.515,-0.09],[51.52,-0.06],[51.53,-0.02]]},
    {id:"s3",name:"Hilltop Circuit",time:"42 min",dist:"33.5 km",scenic:10,traffic:3,relax:7,adv:6,color:"#6ee7b7",ai:"The only route with a full city panorama viewpoint. Zero traffic, maximum spectacle.",wp:[[51.505,-0.09],[51.5,-0.12],[51.51,-0.13],[51.52,-0.1],[51.53,-0.02]]},
  ],
  relaxing:[
    {id:"r1",name:"Green Corridor",time:"29 min",dist:"25.1 km",scenic:7,traffic:8,relax:10,adv:2,color:"#06b6d4",ai:"Fewer merges, wider lanes, tree-lined for the last 6km. Drive calm, arrive calm.",wp:[[51.505,-0.09],[51.508,-0.1],[51.518,-0.08],[51.525,-0.04],[51.53,-0.02]]},
    {id:"r2",name:"Suburb Glide",time:"31 min",dist:"27.4 km",scenic:6,traffic:9,relax:9,adv:1,color:"#22d3ee",ai:"30km/h zones and timed lights. No sudden stops, no lane jockeying.",wp:[[51.505,-0.09],[51.51,-0.095],[51.52,-0.075],[51.53,-0.02]]},
    {id:"r3",name:"Canal Path",time:"36 min",dist:"29.8 km",scenic:8,traffic:9,relax:10,adv:3,color:"#67e8f9",ai:"No traffic lights for the middle 14km. The most genuinely peaceful option available.",wp:[[51.505,-0.09],[51.5,-0.095],[51.495,-0.08],[51.5,-0.05],[51.53,-0.02]]},
  ],
  local:[
    {id:"l1",name:"Market Quarter",time:"33 min",dist:"26.9 km",scenic:8,traffic:5,relax:6,adv:7,color:"#f59e0b",ai:"Passes the covered market, 1920s cinema, and three bakeries open at 06:30.",wp:[[51.505,-0.09],[51.51,-0.1],[51.515,-0.08],[51.52,-0.05],[51.53,-0.02]]},
    {id:"l2",name:"Old Town Weave",time:"37 min",dist:"24.3 km",scenic:9,traffic:4,relax:5,adv:8,color:"#fbbf24",ai:"Cobblestone sections GPS usually avoids. A shortcut saves 4 minutes nobody outside the district knows.",wp:[[51.505,-0.09],[51.507,-0.1],[51.512,-0.11],[51.52,-0.07],[51.53,-0.02]]},
    {id:"l3",name:"Artist District",time:"40 min",dist:"28.1 km",scenic:8,traffic:6,relax:7,adv:6,color:"#fcd34d",ai:"Through the regenerated warehouse district, past street murals and independent coffee roasters.",wp:[[51.505,-0.09],[51.5,-0.1],[51.505,-0.11],[51.515,-0.09],[51.53,-0.02]]},
  ],
  adventure:[
    {id:"a1",name:"Ridge Run",time:"44 min",dist:"38.2 km",scenic:9,traffic:2,relax:4,adv:10,color:"#ef4444",ai:"Unpaved section for 4km through moorland. The kind of route that becomes a story.",wp:[[51.505,-0.09],[51.5,-0.12],[51.495,-0.1],[51.505,-0.06],[51.53,-0.02]]},
    {id:"a2",name:"Coastal Detour",time:"51 min",dist:"45.7 km",scenic:10,traffic:1,relax:6,adv:10,color:"#f87171",ai:"33 minutes longer than fastest. You will see the sea from 200 metres elevation.",wp:[[51.505,-0.09],[51.5,-0.13],[51.49,-0.11],[51.5,-0.06],[51.53,-0.02]]},
    {id:"a3",name:"Forest Traverse",time:"47 min",dist:"41.3 km",scenic:8,traffic:1,relax:5,adv:9,color:"#fca5a5",ai:"Zero mobile signal for 18 minutes. The map runs out, the road doesn't.",wp:[[51.505,-0.09],[51.495,-0.11],[51.49,-0.09],[51.5,-0.05],[51.53,-0.02]]},
  ],
};

// ── STATE ────────────────────────────────────────────────────────────────────
let state={page:"hero",mood:"scenic",route:null,from:"London Bridge, SE1",to:"Hampstead Heath, NW3",searched:false,tab:"search"};
let mapInst=null, mapLayer=null;

function setState(patch){Object.assign(state,patch);render();}

// ── LOGO SVG ─────────────────────────────────────────────────────────────────
function logoSVG(size=32){
  const vb=60,c=30,rR=vb*.27,tD=vb*.46,lW=vb*.022,dR=vb*.06;
  const angles=[225,315,9,63,117,171];
  let spokes="";
  angles.forEach(deg=>{
    const r=deg*Math.PI/180;
    const sx=c+rR*Math.cos(r),sy=c+rR*Math.sin(r);
    const ex=c+tD*Math.cos(r),ey=c+tD*Math.sin(r);
    spokes+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${COL}" stroke-width="${lW}" stroke-linecap="round"/>`;
    spokes+=`<circle cx="${ex}" cy="${ey}" r="${dR}" fill="${COL}"/>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${vb} ${vb}" fill="none">
    ${spokes}
    <circle cx="${c}" cy="${c}" r="${rR}" stroke="${COL}" stroke-width="${vb*.038}" fill="#000"/>
    <text x="${c}" y="${c+vb*.105}" text-anchor="middle" fill="${COL}" font-size="${vb*.295}" font-weight="800" font-family="-apple-system,sans-serif" letter-spacing="0.5">SL</text>
  </svg>`;
}

// ── SCORE BAR ────────────────────────────────────────────────────────────────
function scoreBarHTML(label,value,color){
  return `<div style="margin-bottom:7px">
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">
      <span>${label}</span><span style="color:${color};font-weight:700">${value}/10</span>
    </div>
    <div style="height:2px;background:rgba(255,255,255,.06);border-radius:99px">
      <div class="sbar" data-w="${value*10}" data-c="${color}" style="height:100%;width:0%;border-radius:99px;transition:width .9s cubic-bezier(.23,1,.32,1)"></div>
    </div>
  </div>`;
}

function animateBars(){
  document.querySelectorAll('.sbar').forEach(b=>{
    setTimeout(()=>{b.style.width=b.dataset.w+'%';b.style.background=b.dataset.c;},100);
  });
}

// ── ROUTE CARD ───────────────────────────────────────────────────────────────
function routeCardHTML(r,moodObj){
  const active=state.route&&state.route.id===r.id;
  const ai=active?`<div style="margin-top:10px;padding:9px 11px;background:rgba(245,224,32,.04);border-radius:8px;border-left:2px solid ${r.color}">
    <div style="font-size:9px;color:${r.color};letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:4px">AI Insight</div>
    <p style="font-size:11px;color:#777;line-height:1.6;margin:0">${r.ai}</p>
  </div>`:"";
  return `<div class="rcard ${active?'active':''}" data-id="${r.id}" style="cursor:pointer;border-radius:12px;padding:14px 16px;margin-bottom:8px;border:1px solid ${active?r.color+'88':'rgba(255,255,255,.06)'};background:${active?`linear-gradient(135deg,${r.color}14,${r.color}06)`:'rgba(255,255,255,.015)'};transition:all .3s;position:relative;overflow:hidden">
    ${active?`<div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,${r.color},transparent)"></div>`:''}
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <div>
        <div style="font-size:11px;color:${r.color};font-weight:700;margin-bottom:3px">${moodObj.icon} ${r.name}</div>
        <div style="display:flex;gap:8px;align-items:baseline">
          <span style="color:#f5f5f5;font-weight:700;font-size:16px">${r.time}</span>
          <span style="color:#555;font-size:11px">· ${r.dist}</span>
        </div>
      </div>
      ${active?`<div style="width:6px;height:6px;border-radius:50%;background:${r.color};margin-top:3px"></div>`:''}
    </div>
    ${scoreBarHTML('Scenic',r.scenic,SLY)}
    ${scoreBarHTML('Traffic',r.traffic,'#c8f520')}
    ${scoreBarHTML('Relaxation',r.relax,'#f5a820')}
    ${scoreBarHTML('Adventure',r.adv,'#f57820')}
    ${ai}
  </div>`;
}

// ── MAP ──────────────────────────────────────────────────────────────────────
function initMap(el){
  if(mapInst)return;
  mapInst=L.map(el,{center:[51.513,-0.06],zoom:12,zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(mapInst);
  L.control.zoom({position:'bottomright'}).addTo(mapInst);
}

function updateMap(r){
  if(!mapInst)return;
  if(mapLayer)mapInst.removeLayer(mapLayer);
  if(!r)return;
  const g=L.layerGroup();
  L.polyline(r.wp,{color:r.color,weight:16,opacity:.08}).addTo(g);
  L.polyline(r.wp,{color:r.color,weight:3,opacity:.95}).addTo(g);
  r.wp.forEach((wp,i,arr)=>{
    if(i!==0&&i!==arr.length-1)return;
    const s=i===0;
    L.marker(wp,{icon:L.divIcon({className:'',html:`<div style="width:12px;height:12px;border-radius:50%;background:${s?r.color:'#f5f5f5'};border:2px solid ${s?'#0a0a0a':r.color};box-shadow:0 0 14px ${r.color}cc"></div>`,iconSize:[12,12],iconAnchor:[6,6]})}).addTo(g);
  });
  mapLayer=g; g.addTo(mapInst);
  mapInst.fitBounds(r.wp,{padding:[50,50],animate:true,duration:.8});
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  const mob=window.innerWidth<640;
  const moodObj=MOODS.find(m=>m.id===state.mood);
  const routes=ROUTES[state.mood]||[];

  if(state.page==='hero'){
    app.innerHTML=heroHTML();
    setTimeout(()=>{
      const c=document.getElementById('hero-content');
      if(c){c.style.opacity='1';c.style.transform='none';}
    },80);
    return;
  }

  // NAV
  const tabBtns=mob?`<div style="display:flex;background:rgba(255,255,255,.05);border-radius:7px;padding:2px;gap:2px">
    ${['search','map'].map(t=>`<button onclick="setTab('${t}')" style="background:${state.tab===t?'rgba(255,255,255,.1)':'transparent'};border:none;border-radius:5px;padding:4px 10px;color:${state.tab===t?'#f5f5f5':'#555'};font-size:10px;font-weight:700">${t==='search'?'🔍':'🗺️'} ${t}</button>`).join('')}
  </div>`:'';

  const nav=`<nav style="display:flex;align-items:center;justify-content:space-between;padding:${mob?'11px 14px':'13px 22px'};border-bottom:1px solid rgba(255,255,255,.05);background:rgba(10,10,10,.9);backdrop-filter:blur(16px);flex-shrink:0;z-index:100">
    <div style="display:flex;align-items:center;gap:9px">
      ${logoSVG(mob?26:30)}
      <span style="font-weight:800;font-size:${mob?13:15}px;letter-spacing:-.03em">Scout Lane<span style="color:${SLY}">AI</span></span>
    </div>
    <div style="display:flex;gap:7px;align-items:center">
      ${tabBtns}
      <button onclick="goHero()" style="background:transparent;border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:${mob?'4px 9px':'5px 13px'};color:#444;font-size:11px">← Back</button>
    </div>
  </nav>`;

  // PANEL
  const moodBtns=MOODS.map(m=>`<button onclick="setMood('${m.id}')" style="background:${state.mood===m.id?`${m.color}18`:'rgba(255,255,255,.02)'};border:1px solid ${state.mood===m.id?m.color+'88':'rgba(255,255,255,.06)'};border-radius:7px;padding:5px 9px;color:${state.mood===m.id?m.color:'#555'};font-size:10px;font-weight:600;margin:2px">${m.icon} ${m.label}</button>`).join('');

  const routeList=state.searched
    ?routes.map((r,i)=>`<div class="fade" style="animation-delay:${i*.09}s;opacity:0">${routeCardHTML(r,moodObj)}</div>`).join('')
    :`<div style="text-align:center;padding:40px 12px">${logoSVG(36)}<div style="font-size:11px;color:#444;margin-top:8px">Choose your mood and search</div></div>`;

  const panel=`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden;background:#0d0d0d">
    <div style="padding:14px 14px 0;flex-shrink:0">
      <div style="margin-bottom:8px">
        <div style="font-size:9px;color:#444;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">From</div>
        <div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:9px 11px">
          <span>📍</span><input id="inp-from" value="${state.from}" placeholder="Start location" oninput="state.from=this.value"/>
        </div>
      </div>
      <div style="margin-bottom:10px">
        <div style="font-size:9px;color:#444;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">To</div>
        <div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:9px 11px">
          <span>🏁</span><input id="inp-to" value="${state.to}" placeholder="Destination" oninput="state.to=this.value"/>
        </div>
      </div>
      <div style="margin-bottom:10px">
        <div style="font-size:9px;color:#444;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">Travel Mood</div>
        <div style="display:flex;flex-wrap:wrap">${moodBtns}</div>
        <div style="font-size:10px;color:#444;font-style:italic;margin-top:5px">${moodObj.desc}</div>
      </div>
      <button onclick="doSearch()" style="width:100%;background:linear-gradient(135deg,${moodObj.color},${moodObj.color}cc);border:none;border-radius:9px;padding:10px;color:#0a0a0a;font-size:12px;font-weight:800;margin-bottom:12px">Find Routes →</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:0 14px 14px">${routeList}</div>
  </div>`;

  // MAP OVERLAYS
  const routeInfo=state.route?`<div style="position:absolute;top:12px;right:12px;z-index:500;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border:1px solid ${state.route.color}44;border-radius:11px;padding:10px 14px;max-width:190px">
    <div style="font-size:9px;color:${state.route.color};letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:6px">${moodObj.icon} ${state.route.name}</div>
    <div style="display:flex;gap:14px">
      <div><div style="font-size:18px;font-weight:900">${state.route.time}</div><div style="font-size:9px;color:#444">travel time</div></div>
      <div><div style="font-size:18px;font-weight:900">${state.route.dist}</div><div style="font-size:9px;color:#444">distance</div></div>
    </div>
  </div>`:'';

  const compBar=state.searched&&state.route?`<div style="position:absolute;bottom:16px;left:0;right:0;z-index:500;display:flex;gap:5px;overflow-x:auto;padding:0 12px">
    ${routes.map(r=>`<button onclick="pickRoute('${r.id}')" style="flex-shrink:0;background:${state.route.id===r.id?r.color:'rgba(10,10,10,.88)'};backdrop-filter:blur(14px);border:1px solid ${state.route.id===r.id?r.color:'rgba(255,255,255,.08)'};border-radius:8px;padding:6px 12px;color:${state.route.id===r.id?'#0a0a0a':'#555'};font-size:11px;font-weight:700;white-space:nowrap">${r.time} <span style="font-weight:400;opacity:.6">${r.dist}</span></button>`).join('')}
  </div>`:'';

  const backBtn=mob&&state.route?`<button onclick="setTab('search')" style="position:absolute;top:12px;left:12px;z-index:600;background:rgba(10,10,10,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 12px;color:#888;font-size:11px">← Routes</button>`:'';

  const mapDiv=`<div id="map-wrap" style="position:absolute;inset:0">
    <div id="mapel" style="width:100%;height:100%"></div>
    <div id="map-empty" style="position:absolute;inset:0;display:${state.route?'none':'flex'};flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,10,.5);backdrop-filter:blur(3px);z-index:2;pointer-events:none">
      <div style="opacity:.3;margin-bottom:8px">${logoSVG(44)}</div>
      <div style="color:#444;font-size:12px">Select a route to visualise it</div>
    </div>
    ${routeInfo}${compBar}${backBtn}
  </div>`;

  // LAYOUT
  if(mob){
    app.innerHTML=`${nav}<div style="flex:1;position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;display:${state.tab==='search'?'flex':'none'};flex-direction:column">${panel}</div>
      <div style="position:absolute;inset:0;display:${state.tab==='map'?'block':'none'}">${mapDiv}</div>
    </div>`;
  } else {
    const pw=window.innerWidth<1024?280:350;
    app.innerHTML=`${nav}<div style="flex:1;display:flex;overflow:hidden">
      <div style="width:${pw}px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.05)">${panel}</div>
      <div style="flex:1;position:relative;min-width:0">${mapDiv}</div>
    </div>`;
  }

  // init/update map
  const mel=document.getElementById('mapel');
  if(mel){
    if(!mapInst){initMap(mel);}
    else{setTimeout(()=>mapInst.invalidateSize(),50);}
    updateMap(state.route);
  }

  // bind route card clicks
  document.querySelectorAll('.rcard').forEach(c=>{
    c.addEventListener('click',()=>pickRoute(c.dataset.id));
  });

  animateBars();
}

// ── HERO ─────────────────────────────────────────────────────────────────────
function heroHTML(){
  return `<div style="min-height:100vh;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px">
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(245,224,32,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,224,32,.03) 1px,transparent 1px);background-size:64px 64px"></div>
    <div style="position:absolute;top:10%;left:10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#F5E02015 0%,transparent 70%);animation:pulse 5s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:8%;right:8%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#10b98110 0%,transparent 70%);animation:pulse 6s ease-in-out infinite 1.5s"></div>
    <div id="hero-content" style="text-align:center;z-index:2;opacity:0;transform:translateY(24px);transition:all 1s cubic-bezier(.23,1,.32,1)">
      <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(245,224,32,.08);border:1px solid rgba(245,224,32,.2);border-radius:99px;padding:5px 16px;margin-bottom:28px;font-size:11px;color:${SLY};letter-spacing:.1em;text-transform:uppercase">
        <span style="width:5px;height:5px;border-radius:50%;background:${SLY};display:inline-block;animation:pulse 1.5s ease-in-out infinite"></span>
        AI-Powered Route Intelligence
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px">
        ${logoSVG(52)}
        <div style="font-size:clamp(28px,5vw,44px);font-weight:900;letter-spacing:-.04em">Scout Lane<span style="color:${SLY}">AI</span></div>
      </div>
      <h1 style="font-size:clamp(34px,6vw,64px);font-weight:900;line-height:1.05;margin:0 0 16px;letter-spacing:-.03em">
        Routes that feel<br>
        <span style="background:linear-gradient(135deg,${SLY},#c8f520,#f5a820);-webkit-background-clip:text;-webkit-text-fill-color:transparent">like you</span>
      </h1>
      <p style="font-size:clamp(14px,2vw,17px);color:#555;max-width:440px;margin:0 auto 36px;line-height:1.75">
        Not the fastest. Not the shortest.<br>The route that matches your mood, your morning, your moment.
      </p>
      <button onclick="goApp()" style="background:linear-gradient(135deg,${SLY},#d4c01a);border:none;border-radius:12px;padding:13px 36px;color:#0a0a0a;font-size:15px;font-weight:800;box-shadow:0 0 32px ${SLY}44;transition:all .2s" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'">
        Open Scout Lane →
      </button>
      <div style="display:flex;justify-content:center;gap:36px;margin-top:48px;flex-wrap:wrap">
        ${[['5 moods','Route personalities'],['AI insight','Per-route analysis'],['Live scores','Real-time comparison']].map(([n,l])=>`<div style="text-align:center"><div style="font-size:18px;font-weight:800">${n}</div><div style="font-size:10px;color:#444;margin-top:2px;text-transform:uppercase;letter-spacing:.05em">${l}</div></div>`).join('')}
      </div>
    </div>
  </div>`;
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
function goApp(){setState({page:'app',tab:'search'});}
function goHero(){mapInst=null;mapLayer=null;setState({page:'hero'});}
function setMood(id){setState({mood:id,route:null,searched:false});}
function setTab(t){setState({tab:t});}
function doSearch(){
  const routes=ROUTES[state.mood]||[];
  setState({searched:true,route:routes[0],tab:'map'});
}
function pickRoute(id){
  const routes=ROUTES[state.mood]||[];
  const r=routes.find(x=>x.id===id);
  if(r)setState({route:r,tab:'map'});
}

window.addEventListener('resize',()=>render());
render();
</script>
</body>
</html>
